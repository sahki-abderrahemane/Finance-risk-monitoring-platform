apiVersion: v1
kind: Service
metadata:
  name: sentinel-ai-prometheus
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: sentinel-ai
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP