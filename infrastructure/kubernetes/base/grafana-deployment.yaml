apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ai-grafana
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: sentinel-ai
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: grafana

  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: sentinel-ai

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-ai-grafana-credentials
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            - name: grafana-data
              mountPath: /var/lib/grafana

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20

      volumes:
        - name: grafana-datasources
          configMap:
            name: sentinel-ai-grafana-datasources

        - name: grafana-dashboards
          configMap:
            name: sentinel-ai-grafana-dashboard-providers

        - name: grafana-data
          emptyDir:
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ai-grafana
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: sentinel-ai
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: grafana

  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
