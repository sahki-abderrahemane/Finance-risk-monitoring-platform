apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ai-multimodal-engine-api
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: multimodal-engine-api
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multimodal-engine-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multimodal-engine-api
        app.kubernetes.io/component: ml
        app.kubernetes.io/part-of: sentinel-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: multimodal-engine-api
          image: sentinel-ai-multimodal-engine-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: SENTINEL_SERVICE_NAME
              value: multimodal-engine-api
            - name: SENTINEL_ENVIRONMENT
              value: production
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ml-models
              mountPath: /app/ml/models
              readOnly: true
            - name: ml-features
              mountPath: /app/ml/datasets/multimodal/features
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: sentinel-ai-ml-models
        - name: ml-features
          persistentVolumeClaim:
            claimName: sentinel-ai-ml-features

---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ai-multimodal-engine-api
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: multimodal-engine-api
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: multimodal-engine-api
  ports:
    - name: http
      port: 8005
      targetPort: http
      protocol: TCP
