apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ai-alertmanager
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: sentinel-ai
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager

  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: sentinel-ai

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.29.0
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager

          ports:
            - name: http
              containerPort: 9093
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true

            - name: alertmanager-data
              mountPath: /alertmanager

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20

      volumes:
        - name: alertmanager-config
          secret:
            secretName: sentinel-ai-alertmanager-config

        - name: alertmanager-data
          emptyDir:
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ai-alertmanager
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: sentinel-ai
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: alertmanager

  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP