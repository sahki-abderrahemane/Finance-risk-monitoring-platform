apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-ai-prometheus-config
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: sentinel-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - sentinel-ai-alertmanager:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:

      # Kubernetes API server discovery.
      #
      # This is intentionally limited to Kubernetes control-plane
      # discovery metadata. Application services will be added only
      # after their actual metrics contracts are established.
      - job_name: kubernetes-api
        kubernetes_sd_configs:
          - role: endpoints

        scheme: https

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: default;kubernetes;https

      # Kubernetes pods exposing Prometheus metrics can opt in
      # explicitly through annotations.
      #
      # Sentinel-AI services expose /metrics via sentinel_observability middleware.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"

          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"

          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__

          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace

          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod

          - source_labels:
              - __meta_kubernetes_pod_node_name
            action: replace
            target_label: node

      # Direct service discovery for Sentinel-AI API services.
      - job_name: sentinel-ai-services
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - sentinel-ai

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: sentinel-ai-.*;http