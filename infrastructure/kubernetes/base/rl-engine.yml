apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-engine
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: rl-engine
    app.kubernetes.io/component: rl-engine
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: rl-engine

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rl-engine
        app.kubernetes.io/component: rl-engine
        app.kubernetes.io/part-of: sentinel-ai

    spec:
      serviceAccountName: sentinel-ai-runtime

      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: rl-engine

          image: ghcr.io/REPLACE_OWNER/sentinel-ai-rl-engine:REPLACE_TAG

          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: sentinel-ai-platform-config

            - configMapRef:
                name: sentinel-ai-rl-engine-config

            - configMapRef:
                name: sentinel-ai-release
                optional: true

          env:
            - name: SERVICE_NAME
              value: "rl-engine"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: rl-engine
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: rl-engine
    app.kubernetes.io/component: rl-engine
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: rl-engine

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
