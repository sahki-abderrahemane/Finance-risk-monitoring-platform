apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-ai-rag-engine-config
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: rag-engine
    app.kubernetes.io/part-of: sentinel-ai
data:
  RAG_ENGINE_PORT: "8003"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  EMBEDDING_DEVICE: "cpu"
  EMBEDDING_BATCH_SIZE: "32"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "64"
  RETRIEVAL_TOP_K: "5"
  RETRIEVAL_MAX_DISTANCE: "1.0"
  MAX_UPLOAD_SIZE_MB: "25"
  LLM_PROVIDER: "none"
  LLM_TEMPERATURE: "0.0"
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: "sentinel-ai-rag"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-ai-rl-engine-config
  namespace: sentinel-ai
  labels:
    app.kubernetes.io/name: rl-engine
    app.kubernetes.io/part-of: sentinel-ai
data:
  RL_ENGINE_PORT: "8000"
