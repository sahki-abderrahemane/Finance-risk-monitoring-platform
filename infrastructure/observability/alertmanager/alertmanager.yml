global:
  resolve_timeout: 5m

route:
  receiver: webhook

  group_by:
    - alertname
    - severity

  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

  routes:
    - receiver: webhook
      matchers:
        - severity="critical"
      continue: true

    - receiver: webhook
      matchers:
        - severity="warning"
      continue: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname

receivers:
  - name: webhook
    webhook_configs:
      - url: http://alertmanager-webhook:5001/alerts
        send_resolved: true
