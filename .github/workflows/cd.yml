name: Sentinel-AI CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

      image_tag:
        description: "Immutable container tag to deploy"
        required: true
        type: string

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: read

concurrency:
  group: sentinel-ai-cd-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  KUBERNETES_NAMESPACE: sentinel-ai

jobs:
  validate-manifests:
    name: Validate Kubernetes Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate staging overlay
        run: |
          set -euo pipefail
          kustomize build infrastructure/kubernetes/overlays/staging | \
            kubectl apply --dry-run=client --validate=true -f -

      - name: Validate production overlay
        run: |
          set -euo pipefail
          kustomize build infrastructure/kubernetes/overlays/production | \
            kubectl apply --dry-run=client --validate=true -f -

  determine-release:
    name: Determine Release
    runs-on: ubuntu-latest
    needs: validate-manifests

    outputs:
      environment: ${{ steps.release.outputs.environment }}
      image_tag: ${{ steps.release.outputs.image_tag }}

    steps:
      - name: Determine deployment target
        id: release
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_ENVIRONMENT}" ]]; then
            environment="${INPUT_ENVIRONMENT}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            environment="production"
          else
            environment="staging"
          fi

          if [[ -n "${INPUT_IMAGE_TAG}" ]]; then
            image_tag="${INPUT_IMAGE_TAG}"
          else
            image_tag="${GITHUB_SHA_VALUE}"
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          echo "Deployment environment: ${environment}"
          echo "Immutable image tag: ${image_tag}"

  deploy-platform:
    name: Deploy Platform
    runs-on: ubuntu-latest
    needs: determine-release

    environment:
      name: ${{ needs.determine-release.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure Kubernetes access
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [[ -z "${KUBE_CONFIG}" ]]; then
            echo "::error::KUBE_CONFIG is not configured for this environment."
            exit 1
          fi

          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG}" > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get namespace

      - name: Select overlay
        id: overlay
        run: |
          echo "path=infrastructure/kubernetes/overlays/${{ needs.determine-release.outputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Build and apply kustomize overlay
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.determine-release.outputs.environment }}
          IMAGE_TAG: ${{ needs.determine-release.outputs.image_tag }}
        run: |
          set -euo pipefail

          kustomize build "${{ steps.overlay.outputs.path }}" | \
            kubectl apply -f -

      - name: Apply release configuration
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.determine-release.outputs.environment }}
          IMAGE_TAG: ${{ needs.determine-release.outputs.image_tag }}
        run: |
          set -euo pipefail

          kubectl -n "${KUBERNETES_NAMESPACE}" \
            create configmap sentinel-ai-release \
            --from-literal=environment="${DEPLOYMENT_ENVIRONMENT}" \
            --from-literal=image_tag="${IMAGE_TAG}" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      - name: Verify deployment
        run: |
          set -euo pipefail
          echo "Verifying namespace..."
          kubectl get namespace "${KUBERNETES_NAMESPACE}"
          echo ""
          echo "Verifying pods..."
          kubectl -n "${KUBERNETES_NAMESPACE}" get pods -o wide
          echo ""
          echo "Verifying services..."
          kubectl -n "${KUBERNETES_NAMESPACE}" get services
          echo ""
          echo "Verifying deployments..."
          kubectl -n "${KUBERNETES_NAMESPACE}" get deployments
          echo ""
          echo "Verifying network policies..."
          kubectl -n "${KUBERNETES_NAMESPACE}" get networkpolicies
