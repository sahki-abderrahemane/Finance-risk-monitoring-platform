name: Sentinel-AI Container Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: sentinel-ai-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  discover-services:
    name: Discover Containerized Services
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.services.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover Python services
        id: services
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          services = []

          for pyproject in sorted(Path("services").glob("*/pyproject.toml")):
              service_dir = pyproject.parent
              service_name = service_dir.name

              services.append(
                  {
                      "name": service_name,
                      "path": str(service_dir),
                  }
              )

          if not services:
              raise SystemExit(
                  "No service pyproject.toml files were discovered."
              )

          print("Discovered services:")

          for service in services:
              print(
                  f"  - {service['name']}: "
                  f"{service['path']}"
              )

          with open(
              "${GITHUB_OUTPUT}",
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "matrix="
                  + json.dumps(
                      {"service": services},
                      separators=(",", ":"),
                  )
                  + "\n"
              )
          PY

  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: discover-services

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository_owner="$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')"
          service_name="$(echo '${{ matrix.service.name }}' | tr '[:upper:]' '[:lower:]' | tr '_' '-')"

          echo "name=${{ env.REGISTRY }}/${repository_owner}/sentinel-ai-${service_name}" \
            >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Select Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -euo pipefail

          service_name="${{ matrix.service.name }}"
          service_specific="infrastructure/docker/${service_name}/Dockerfile"
          generic="infrastructure/docker/Dockerfile.python-service"

          if [[ -f "${service_specific}" ]]; then
            echo "file=${service_specific}" >> "$GITHUB_OUTPUT"
            echo "Using service-specific Dockerfile: ${service_specific}"
          elif [[ -f "${generic}" ]]; then
            echo "file=${generic}" >> "$GITHUB_OUTPUT"
            echo "Using generic Dockerfile: ${generic}"
          else
            echo "::error::No Dockerfile found for service ${service_name}"
            exit 1
          fi

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: true
          sbom: true

      - name: Container build summary
        run: |
          echo "Service: ${{ matrix.service.name }}"
          echo "Source:  ${{ matrix.service.path }}"
          echo "Image:   ${{ steps.image.outputs.name }}"
          echo "Dockerfile: ${{ steps.dockerfile.outputs.file }}"