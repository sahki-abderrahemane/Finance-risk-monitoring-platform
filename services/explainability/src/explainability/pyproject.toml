[build-system]
requires = [
    "setuptools>=68",
    "wheel>=0.41",
]
build-backend = "setuptools.build_meta"


[project]
name = "sentinel-ai-explainability"
version = "0.1.0"
description = "Sentinel-AI Phase 5 explainability service"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "shap>=0.45,<1.0",
    "lime>=0.2.0.1,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true