[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rag-engine"
version = "0.1.0"
description = "Sentinel-AI grounded RAG and explanation service"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",

    "langchain-postgres>=0.0.12,<1.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",

    "sentence-transformers>=3.1,<6.0",
    "numpy>=2.1,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "sentinel-observability>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.15,<2.0",
]

observability = [
    "langsmith>=0.1,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]