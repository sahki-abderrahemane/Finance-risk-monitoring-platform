[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-engine-api"
version = "0.1.0"
description = "Sentinel-AI Vision Engine HTTP API"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "numpy>=2.1,<3.0",
    "torch>=2.1,<3.0",
    "torchvision>=0.20,<1.0",
    "Pillow>=10.0,<11.0",
]
