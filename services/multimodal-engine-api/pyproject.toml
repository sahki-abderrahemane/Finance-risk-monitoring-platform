[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-engine-api"
version = "0.1.0"
description = "Sentinel-AI Multimodal Engine HTTP API"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "torch>=2.1,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]
