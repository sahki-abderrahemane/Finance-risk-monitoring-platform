[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rl-engine"
version = "0.1.0"
description = "Sentinel-AI reinforcement-learning simulation API"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "torch>=2.1,<3.0",
    "sentinel-observability>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
