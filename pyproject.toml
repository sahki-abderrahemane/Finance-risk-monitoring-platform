[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Sentinel-AI financial risk and simulation platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["services/data_engine/src", "services/risk-engine/src"]

[tool.pytest.ini_options]
testpaths = [
    "services/data_engine/tests",
    "services/risk-engine/tests",
]
pythonpath = [".", "services/risk-engine/src"]
